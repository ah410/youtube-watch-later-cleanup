<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#1f2430" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="#F3F4F6"/>

  <g filter="url(#shadow)">
    <rect x="390" y="180" width="500" height="420" rx="24" fill="#FFFFFF"/>
  </g>

  <!-- header -->
  <g transform="translate(430,222) scale(0.4375)">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="#0E7C86"/>
    <rect x="20" y="32" width="52" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="20" y="50" width="52" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
    <rect x="20" y="68" width="36" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>
    <g transform="rotate(35 74 60)">
      <line x1="74" y1="18" x2="74" y2="56" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M65 52 L83 52 L91 78 L57 78 Z" fill="#FFFFFF"/>
      <line x1="62" y1="78" x2="58" y2="98" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line x1="70" y1="78" x2="68" y2="100" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line x1="78" y1="78" x2="80" y2="100" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line x1="86" y1="78" x2="90" y2="98" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="502" y="260" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f2430">Watch Later Cleanup</text>

  <!-- description -->
  <text x="430" y="316" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#6b7280">Removes every video from your YouTube Watch</text>
  <text x="430" y="340" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#6b7280">Later playlist, right from this tab.</text>

  <!-- status -->
  <rect x="430" y="370" width="420" height="56" rx="12" fill="#FFFFFF" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="458" cy="398" r="8" fill="#9ca3af"/>
  <text x="480" y="405" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#1f2430">Ready</text>

  <!-- button -->
  <rect x="430" y="448" width="420" height="56" rx="12" fill="#4F46E5"/>
  <text x="640" y="483" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Start</text>

  <!-- footer -->
  <text x="640" y="560" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#9ca3af">View source on GitHub</text>
</svg>
