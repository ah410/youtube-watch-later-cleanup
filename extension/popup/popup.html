<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Watch Later Cleanup</title>
    <link rel="stylesheet" href="../dist/popup/popup.css" />
  </head>
  <body
    class="w-80 bg-white p-4 font-sans text-sm text-gray-900 dark:bg-gray-900 dark:text-gray-100"
  >
    <header class="mb-2 flex items-center gap-2">
      <img src="../icons/icon48.png" width="28" height="28" alt="" />
      <h1 class="text-[15px] font-semibold">Watch Later Cleanup</h1>
    </header>

    <p class="mb-3.5 leading-snug text-gray-500 dark:text-gray-400">
      Removes every video from your YouTube Watch Later playlist, right from this tab.
    </p>

    <div
      id="status"
      data-state="idle"
      class="group mb-3 flex items-center gap-2 rounded-lg border border-gray-200 px-3 py-2.5 dark:border-gray-700"
    >
      <span
        id="status-dot"
        class="h-2 w-2 shrink-0 rounded-full bg-gray-400 group-data-[state=running]:bg-blue-600 group-data-[state=done]:bg-green-700 group-data-[state=error]:bg-red-600"
      ></span>
      <span id="status-text">Checking page&hellip;</span>
    </div>

    <button
      id="toggle"
      disabled
      class="w-full cursor-pointer rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white data-[running=true]:bg-red-600 disabled:cursor-default disabled:bg-gray-200 disabled:text-gray-500 dark:bg-indigo-500 dark:data-[running=true]:bg-red-600 dark:disabled:bg-gray-700 dark:disabled:text-gray-400"
    >
      Start
    </button>

    <footer class="mt-3.5 text-center">
      <a
        class="text-xs text-gray-500 no-underline hover:underline dark:text-gray-400"
        href="https://github.com/ah410/Remove-Watch-Later-Script"
        target="_blank"
        rel="noopener"
        >View source on GitHub</a
      >
    </footer>

    <script src="../dist/popup/popup.js" defer></script>
  </body>
</html>
