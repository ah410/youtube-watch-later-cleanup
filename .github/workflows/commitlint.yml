# Enforces Conventional Commits (see CONTRIBUTING.md) on every commit in a PR.
name: Commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the whole PR commit range is linted

      - uses: wagoid/commitlint-github-action@v6
